<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoteConvert</title><link rel="stylesheet" href="style.css">
<header><b><span class="mark">▧</span> LoteConvert</b><span>● &nbsp; Processamento local</span></header>
<main><h1>Conversor de imagens<span>.</span></h1><p>Escolha suas imagens e converta o lote de uma vez. Os arquivos ficam no seu dispositivo.</p>
<div class="grid"><section><h2>Imagens do lote</h2><label id="drop"><strong>Solte suas imagens aqui</strong><small>PNG, JPEG e WebP · Até 40 arquivos<br>15 MB e 20 megapixels por imagem</small><input id="files" type="file" multiple accept="image/png,image/jpeg,image/webp"><span class="choose">Selecionar imagens</span></label>
<div class="heading"><b id="count">Nenhum arquivo</b><button id="clear" hidden>Limpar lote</button></div><div id="list"></div></section>
<aside><h2>Opções de saída</h2><label for="format">Formato</label><select id="format"><option>WebP</option><option>JPEG</option><option>PNG</option></select><label for="quality">Qualidade <output id="percent">85%</output></label><input id="quality" type="range" min="1" max="100" value="85"><small id="help">Mais qualidade pode gerar arquivos maiores.</small><button id="convert" class="primary" disabled>Converter lote →</button><button id="zip" disabled>Baixar resultados em .zip</button></aside></div><p id="notice" role="status"></p></main><script src="vendor/jszip.min.js"></script><script src="app.js"></script></html>
